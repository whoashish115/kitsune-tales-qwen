repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
  - repo: local
    hooks:
      - id: no-hf-or-wandb-tokens
        name: block Hugging Face / W&B tokens
        language: pygrep
        entry: '(hf_[A-Za-z0-9]{30,}|WANDB_API_KEY\s*=\s*[0-9a-f]{20,})'
        types: [text]
