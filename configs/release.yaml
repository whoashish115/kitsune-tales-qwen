# the GGUF export and the model cards use the released model. `system` is a key of configs/eval.yaml.
ja:
  system: kitsune-sft      # SFT. SFT + DPO v2 failed the safety condition (18 % vs 4 % policy violations)
  merged: sft-main
en:
  system: kitsune-en       # SFT + DPO with safety pairs; re-checked against the rule once the English judge is in
  merged: dpo-en-main
