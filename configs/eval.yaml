# Evaluation (D-008, D-010). One decoding config for every system, for a fair comparison.
seeds: [0, 1, 2]
decoding:
  temperature: 0.8
  top_p: 0.95
  top_k: 50
  presence_penalty: 0.0
  repetition_penalty: 1.05
max_new_tokens:            # generous caps; length adherence is measured, not enforced
  あらすじ: 900
  短編: 2400
  続き: 1400
max_new_tokens_en:         # English variant (D-024): same generous caps (English needs ~1.3 tokens/word)
  あらすじ: 900
  短編: 2400
  続き: 1400
systems:
  base:        {model: google/gemma-4-E4B-it, revision: ee0ef6023621cff504d758262d4e04895a5af4a2, gpu: L40S}   # D-001a; 16 GB weights do not leave KV room on an L4
  kitsune-sft: {merged: sft-main, gpu: L40S}        # merged + verified weights on the data Volume
  kitsune:     {merged: dpo-main-v2, gpu: L40S}   # SFT + DPO on complete teacher labels (D-027)
  qwen3.5-9b:  {model: Qwen/Qwen3.5-9B, revision: c202236235762e1c871ad0ccb60c8ee5ba337b9a, gpu: L40S}
  qwen3.5-4b:  {model: Qwen/Qwen3.5-4B, revision: 851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a}      # former base candidate
  base-en:     {model: google/gemma-4-E4B-it, revision: ee0ef6023621cff504d758262d4e04895a5af4a2, gpu: L40S, lang: en}
  kitsune-en-sft: {merged: sft-en-main, gpu: L40S, lang: en}   # English SFT (D-024)
  kitsune-en:  {merged: dpo-en-main, gpu: L40S, lang: en}      # English SFT + DPO, the released model (D-026)
  teacher:     {model: Qwen/Qwen3.6-35B-A3B-FP8, revision: 95a723d08a9490559dae23d0cff1d9466213d989, gpu: H100}
judge:
  primary: {model: llm-jp/llm-jp-4-32b-a3b-thinking, revision: 30b90b28539c2d02f23b732a10c846b814730a50}
  n_pairs: 150               # per comparison, each judged in both orders
  validation_stories: 60     # x 5 corruptions, both orders
  comparisons:
    - [kitsune, base]
    - [kitsune, kitsune-sft]
    - [kitsune, teacher]
bootstrap: {n_boot: 10000, alpha: 0.05, seed: 0}
lm_eval:
  # Verified present in lm-eval v0.4.13 (lm_eval/tasks/japanese_leaderboard). Multiple-choice only: cheap, no generation.
  tasks: [ja_leaderboard_jcommonsenseqa, ja_leaderboard_jnli, ja_leaderboard_marc_ja, ja_leaderboard_xwinograd]
  limit: 500
